services:
  vaultqr:
    image: ghcr.io/tojollinor/vaultqr:latest
    container_name: vaultqr
    restart: unless-stopped

    environment:
      PORT: "8080"
      SIZE: "400"
      MAX_SIZE: "1024"
      SESSION_TTL_MINUTES: "30"
      SECRET: ""
      LOG_LEVEL: "normal"

    ports:
      - "8010:8080"

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    read_only: true
    mem_limit: 64m
    pids_limit: 100
